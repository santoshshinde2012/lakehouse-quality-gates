# Generated verification results are kept byte-for-byte.
exclude: ^docs/results/.*\.(xml|svg|json|html|log|md|css|js|png)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: soda-contracts
        name: soda contract syntax
        entry: env DQ_ENGINE=duckdb-local uv run --frozen soda-dq validate
        language: system
        pass_filenames: false
        files: ^contracts/
