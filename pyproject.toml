[project]
name = "lakehouse-quality-gates"
version = "0.3.2"
description = "Contract-gated medallion: Soda Core v4 data contracts as quality gates for local-data-lakehouse"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Santosh Shinde" }]
dependencies = [
  "soda-core==4.26.0",
  "soda-duckdb==4.26.0",
  "duckdb==1.5.6",
  "typer>=0.12,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.4,<3",
  "structlog>=24.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
trino = ["soda-trino==4.26.0"]
lakehouse = ["pyiceberg[pyarrow,s3fs]==0.12.0", "pyarrow==25.0.1"]

[project.scripts]
soda-dq = "soda_lakehouse_dq.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soda_lakehouse_dq"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/research"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "C4", "TID", "ANN", "S"]
# PLC0415: optional/heavy deps (soda, duckdb, pyarrow, lakehouse_client) are imported lazily on purpose.
ignore = ["PLR0913", "S101", "ANN401", "S603", "S607", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S"]
"airflow/**" = ["ANN"]
# Benchmark harnesses: SQL built from generated paths/ints, subprocess calls, wide result rows.
"benchmarks/**" = ["S603", "S607", "S608", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "PLR2004", "E501", "RUF001", "C901"]
"scripts/gen_scale_data.py" = ["S311", "PLR0913", "PLR0917", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/soda_lakehouse_dq", "benchmarks", "scripts"]
exclude = ["benchmarks/tools/"]

[[tool.mypy.overrides]]
module = ["soda_core.*", "soda_duckdb.*", "soda_trino.*", "duckdb.*", "lakehouse_client.*", "pyiceberg.*", "pyarrow.*", "trino.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = ["benchmarks.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs real Soda verification against DuckDB (no containers)"]
addopts = "-ra"
