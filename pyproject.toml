[project]
name = "lakehouse-quality-gates"
version = "1.0.0"
description = "Contract-gated medallion: Soda Core v4 data contracts as quality gates for local-data-lakehouse"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Santosh Shinde" }]
dependencies = [
  "soda-core==4.26.0",
  "soda-duckdb==4.26.0",
  "duckdb==1.5.6",
  "typer>=0.12,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.4,<3",
  "structlog>=24.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
trino = ["soda-trino==4.26.0"]
lakehouse = ["pyiceberg[pyarrow,s3fs]==0.12.0", "pyarrow==25.0.1"]

[project.scripts]
soda-dq = "soda_lakehouse_dq.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.7",
    "jinja2>=3.1,<4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soda_lakehouse_dq"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/research", "docs/results", "benchmarks/tools/tiny/scripts"]  # research scripts kept as run; recorded results (harness copies are hashed)
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "C4", "TID", "ANN", "S"]
# PLC0415: optional/heavy deps (soda, duckdb, pyarrow, lakehouse_client) are imported lazily on purpose.
ignore = ["PLR0913", "S101", "ANN401", "S603", "S607", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S"]
"airflow/**" = ["ANN"]
# Benchmark harnesses: SQL built from generated paths/ints, subprocess calls, wide result rows.
"benchmarks/**" = ["S603", "S607", "S608", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "PLR2004", "E501", "RUF001", "C901"]
# Spark job: identifiers are validated against [a-z0-9_]; pyspark style F alias.
"wap/**" = ["N812", "S608", "E501", "UP017"]  # runs on the Spark image Python 3.10
"scripts/bench_charts.py" = ["E501", "PLR2004", "PLR0917", "RUF001", "RUF046", "PLC0206"]
"scripts/check_numbers.py" = ["RUF001"]
# Figure scripts: plotting code with layout constants and wide labels.
"docs/figures/**" = ["E501", "PLR2004", "PLR0912", "PLR0915", "ANN", "N806", "B007", "B905", "RUF059"]
"scripts/gen_scale_data.py" = ["S311", "PLR0913", "PLR0917", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/soda_lakehouse_dq", "benchmarks", "scripts"]
exclude = ["benchmarks/tools/"]

[[tool.mypy.overrides]]
module = ["soda_core.*", "soda_duckdb.*", "soda_trino.*", "duckdb.*", "lakehouse_client.*", "pyiceberg.*", "pyarrow.*", "trino.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = ["benchmarks.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: T0, pure Python with fakes (tests/unit)",
    "integration: T1, real Soda verification against DuckDB on CSV fixtures, no containers (tests/integration)",
    "live: T2, gates against the running light lakehouse; skipped when it is not up (tests/live)",
    "full: T3, Trino, the ldl-soda container and Airflow; skipped when they are not up (tests/live)",
]
# live and full need Docker; select them explicitly with -m (the last -m wins), see docs/guides/running-and-testing.md
addopts = "-ra -m 'not live and not full'"
