name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SODA_CORE_TELEMETRY_ENABLED: "false"
  DQ_ENGINE: duckdb-local

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
      - name: Type check (mypy --strict)
        run: uv run --frozen mypy
      - name: Docs (links, anchors, Mermaid and snippet sync, duplicate prose)
        run: |
          python scripts/check_links.py
          python scripts/diagrams.py --check
          python scripts/doc_snippets.py --check
          python scripts/check_numbers.py
      - name: Docs (markdownlint)
        run: npx --yes markdownlint-cli2@0.23.3
      - name: Contract syntax (Soda)
        run: uv run --frozen soda-dq validate
      - name: Tests (unit + real Soda/DuckDB integration)
        run: uv run --frozen pytest --cov=soda_lakehouse_dq --cov-report=xml --junitxml=reports/pytest.xml
      - name: Demo gates (good passes, bad blocks)
        run: make demo
      - name: Gate summary
        if: always()
        run: cat reports/*_retail_*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dq-reports
          path: |
            reports/
            coverage.xml

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runner image
        run: docker build -f docker/Dockerfile -t lakehouse-quality-gates:ci .
      - name: Prepare reports for the non-root runner
        run: sudo install -d -o 10001 -g 10001 -m 0755 reports/docker
      - name: Smoke test inside the image
        run: |
          runtime=(
            --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true
            -e DQ_ENGINE=duckdb-local -e DQ_DUCKDB_TEMP_DIRECTORY=/tmp/duckdb
            --mount "type=bind,src=$PWD/reports/docker,dst=/opt/soda-dq/reports"
          )
          docker run "${runtime[@]}" lakehouse-quality-gates:ci soda-dq validate
          docker run "${runtime[@]}" lakehouse-quality-gates:ci soda-dq run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docker-dq-reports
          # Rendered contracts are private scratch files; retain the readable report triples.
          path: |
            reports/docker/*.json
            reports/docker/*.md
            reports/docker/*.xml
